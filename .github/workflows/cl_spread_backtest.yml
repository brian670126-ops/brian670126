name: 原油近遠月價差 - 同向性回測（手動）

on:
  workflow_dispatch:
    inputs:
      years:
        description: '回測往回看幾年'
        required: false
        default: '3'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'three_gate/requirements.txt'

      - name: 安裝依賴
        run: |
          cd three_gate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行回測
        working-directory: three_gate
        run: python src/backtest_cl_spread_vs_near.py --years ${{ github.event.inputs.years }}

      - name: 提交結果到repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add three_gate/data/auto/CL_spread_history_stitched.csv three_gate/analysis/CL_spread_vs_near_backtest.md
          if ! git diff --cached --quiet; then
            git commit -m "回測：原油近遠月價差同向性 $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "無變化，跳過提交"
          fi
