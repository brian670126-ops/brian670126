name: 每日股票關聯分析

on:
  schedule:
    - cron: '30 23 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出 repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install pandas numpy scipy yfinance

      - name: 執行每日分析
        run: python daily_pipeline.py

      - name: 把結果存回 repo
        run: |
          git config user.name "daily-pipeline-bot"
          git config user.email "actions@github.com"
          git add data/ reports/ daily_pipeline.log
          git diff --quiet --cached || git commit -m "自動更新：$(date -u +'%Y-%m-%d')"
          git push
