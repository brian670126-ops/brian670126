name: 三關價系統 - 每日全球商品分析

on:
  schedule:
    - cron: '0 23 * * 0-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'three_gate/requirements.txt'

      - name: 安裝依賴
        run: |
          cd three_gate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 抓取 yfinance 資料
        working-directory: three_gate
        run: python src/fetch_yfinance.py

      - name: 抓取原油近遠月價差
        working-directory: three_gate
        run: python src/fetch_cl_spread.py

      - name: 分析原油價差三關價
        working-directory: three_gate
        run: python src/analyze_cl_spread.py

      - name: 抓取TX台指期資料
        run: |
          pip install requests beautifulsoup4 pandas -q
          DAY=$(TZ='Asia/Taipei' date +%u)
          if [ "$DAY" = "1" ]; then
            LAST_FRI=$(TZ='Asia/Taipei' date -d 'last friday' '+%Y-%m-%d')
            OLD_CLOSE=$(python -c "
          import csv, sys
          path='three_gate/data/auto/TX_daily.csv'
          target='$LAST_FRI'
          try:
              for r in csv.DictReader(open(path)):
                  if r['date']==target: print(r['close']); sys.exit()
          except: pass
          print('')
          " 2>/dev/null || echo "")
            echo "OLD_CLOSE=$OLD_CLOSE"
            python tx_fetcher.py --backfill 7
            echo "週一：backfill 7 天，補週五夜盤"
            python tx_fetcher.py --weekly
            echo "週一：重新彙整週線"
            NEW_CLOSE=$(python -c "
          import csv, sys
          path='three_gate/data/auto/TX_daily.csv'
          target='$LAST_FRI'
          try:
              for r in csv.DictReader(open(path)):
                  if r['date']==target: print(r['close']); sys.exit()
          except: pass
          print('')
          " 2>/dev/null || echo "")
            echo "NEW_CLOSE=$NEW_CLOSE"
            if [ -n "$OLD_CLOSE" ] && [ -n "$NEW_CLOSE" ] && [ "$OLD_CLOSE" != "$NEW_CLOSE" ]; then
              echo "NEED_RESEND=true" >> $GITHUB_ENV
              echo "收盤有更新（$OLD_CLOSE → $NEW_CLOSE），週一重寄週報"
            else
              echo "NEED_RESEND=false" >> $GITHUB_ENV
              echo "收盤無變化，跳過重寄"
            fi
          else
            python tx_fetcher.py --backfill 2
            echo "NEED_RESEND=false" >> $GITHUB_ENV
          fi
          if [ "$DAY" = "6" ]; then
            python tx_fetcher.py --weekly
            echo "週六：已彙整本週週線"
          fi

      - name: 抓取台灣50期貨資料
        run: |
          pip install requests beautifulsoup4 -q
          DAY=$(TZ='Asia/Taipei' date +%u)
          if [ "$DAY" = "1" ]; then
            python t5f_fetcher.py --backfill 7
            echo "週一：backfill 7 天，補週五夜盤"
            python t5f_fetcher.py --weekly
            echo "週一：重新彙整週線"
          else
            python t5f_fetcher.py --backfill 2
          fi
          if [ "$DAY" = "6" ]; then
            python t5f_fetcher.py --weekly
            echo "週六：已彙整本週週線"
          fi

      - name: 執行三關價分析
        working-directory: three_gate
        run: python src/analyze.py

      - name: 產出月彙總報表並寄送Email
        working-directory: three_gate
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python src/monthly_report.py

      - name: 寄送 TX 日K線分析報告（週一至週五）
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          DAY=$(TZ='Asia/Taipei' date +%u)
          if [ "$DAY" != "6" ]; then
            python send_kline_report.py
          else
            echo "週六：跳過日報"
          fi

      - name: 寄送週報（週六或週一更正）
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          DAY=$(TZ='Asia/Taipei' date +%u)
          if [ "$DAY" = "6" ]; then
            python send_weekly_report.py
          elif [ "$DAY" = "1" ] && [ "$NEED_RESEND" = "true" ]; then
            WEEKLY_RESEND=true python send_weekly_report.py
            echo "週一：已寄出更正版週報"
          else
            echo "非週六且無更新：跳過週報"
          fi

      - name: 提交結果到repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add three_gate/data/auto/ three_gate/analysis/ three_gate/strategy/ three_gate/reports/
          if ! git diff --cached --quiet; then
            git commit -m "自動更新：三關價格分析 $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "無變化，跳過提交"
          fi
