name: 三關價系統 - 每日全球商品分析

# 每天台灣時間 06:00 執行（UTC 22:00，週日至週四 = 頭部週一到週五交易日）
# 06:00 = 台指期夜盤 05:00 收盤後 1 小時緩衝
on:
  schedule:
    - cron: '0 22 * * 0-4'
  # 手動觸發也可以
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'three_gate/requirements.txt'

      - name: 安裝依賴
        run: |
          cd three_gate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 抓取 yfinance 資料
        working-directory: three_gate
        run: python src/fetch_yfinance.py

      - name: 抓取TX台指期資料
        run: |
          pip install requests beautifulsoup4 -q
          python tx_fetcher.py --backfill 2
          if [ "$(date +%u)" = "5" ]; then 
            python tx_fetcher.py --weekly
            echo "週五：已彙整本週週線"
          fi

      - name: 執行三關價分析
        working-directory: three_gate
        run: python src/analyze.py

      - name: 提交結果到repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add three_gate/data/auto/ three_gate/analysis/ three_gate/strategy/
          # 只有真的有變化才 commit
          if ! git diff --cached --quiet; then
            git commit -m "自動更新：三關價格分析 $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "無變化，跳過提交"
          fi
