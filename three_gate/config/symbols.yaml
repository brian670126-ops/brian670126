# 三關價系統 - 商品清單
# 每個商品都會計算日/週三關價 + 觸碰 + 方向 + 警訊

# 手動輸入區 (每天你貼 OHLC 到 data/manual/)
manual:
  - code: TX
    name: 台指期
    name_en: Taiwan Index Futures
    category: taiwan
    point_value: 200  # NT$ per point
    
  - code: T5F
    name: 台灣50期貨
    name_en: Taiwan 50 Futures
    category: taiwan
    point_value: 100

# yfinance 自動抓取
auto:
